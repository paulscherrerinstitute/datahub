package:
  name: datahub
  version: "${version}"

source:
  path: ../

build:
  entry_points:
    - main = datahub.main:main
  noarch: python

requirements:
  build:
    - python
  run:
    - python
    - requests
    - h5py
    - python-dateutil
    - numpy
    - pytz

#Optional requirements
#    - pyepics
#    - bsread
#    - bitshuffle
#    - pandas
#    - cbor2
#    - redis
#    - websockets
#    - matplotlib

about:
  home: https://github.com/paulscherrerinstitute/datahub
  license: GPLv3
