package:
  name: datahub
  version: "{{ load_setup_py_data().version }}"

source:
  path: ../

build:
  noarch: python
  script: python -m pip install --no-deps --ignore-installed .
  entry_points:
    - main = datahub.main:main

requirements:
  build:
    - python >=3.6
    - setuptools
    - pip
    - numpy
    - h5py
    - python-dateutil
  run:
    - python  >=3.6
    - requests
    - h5py
    - python-dateutil
    - numpy
    - pytz
    - cbor2

#Optional requirements
#    - pyepics
#    - bsread
#    - bitshuffle
#    - pandas
#    - redis
#    - websockets
#    - matplotlib

about:
  home: https://github.com/paulscherrerinstitute/datahub
  license: GPLv3
